<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Les pires conseils business</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  .title { position: absolute; left: 0; right: 0; top: 140px; text-align: center; }
  .title .k { font-family: var(--cinzel); font-weight: 800; font-size: 44px; letter-spacing: .3em; color: var(--gold); }
  .title .t { font-size: 66px; font-weight: 800; letter-spacing: -0.03em; margin-top: 8px; }
  .grid { position: absolute; left: 50px; right: 50px; top: 340px; display: flex; flex-direction: column; gap: 18px; }
  .row { position: relative; height: 196px; display: flex; gap: 18px; }
  .lab { flex: 0 0 170px; border-radius: 30px; display: flex; align-items: center; justify-content: center; font-family: var(--cinzel); font-weight: 900; font-size: 100px; color: #120f08; }
  .lab.medal { font-size: 120px; background: rgba(20,18,14,.85) !important; border: 3px solid rgba(233,204,127,.5); }
  .slot { flex: 1; border-radius: 30px; border: 2px dashed rgba(233,204,127,.28); background: rgba(20,18,14,.55); position: relative; overflow: hidden; }
  .row.cur .slot { border: 3px solid rgba(243,220,154,.85); box-shadow: 0 0 50px rgba(217,180,90,.3); }
  .q { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 80px; font-weight: 800; color: rgba(233,204,127,.25); }
  .item { position: absolute; inset: 10px; border-radius: 24px; background: linear-gradient(170deg, #1e1a12, #0d0c0a); border: 2px solid rgba(233,204,127,.4); display: flex; align-items: center; gap: 24px; padding: 0 28px; }
  .item .e { font-size: 84px; }
  .item .n { font-size: 42px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .item .r { font-size: 30px; color: #b9ad94; margin-top: 6px; font-weight: 500; line-height: 1.2; }
  .item.top { border: 3px solid #fff1c4; box-shadow: 0 0 70px rgba(217,180,90,.55); background: linear-gradient(170deg, #2d2412, #120f0a); }
  .item.top .n { color: #ffe3a0; font-size: 44px; }
  .item.top .r { padding-right: 140px; }
  .item.top::after { content: "LE PIRE"; position: absolute; right: 18px; bottom: 12px; font-family: var(--cinzel); font-weight: 800; font-size: 24px; letter-spacing: .15em; color: #120f08; background: var(--gold-grad); padding: 6px 14px; border-radius: 999px; }
  .subov { position: absolute; left: 110px; right: 110px; top: 640px; padding: 56px 40px; border-radius: 50px; text-align: center; z-index: 5; }
  .subbtn .b { display: none; } .subbtn.done .a { display: none; } .subbtn.done .b { display: inline; }
  .opinion { position: absolute; left: 0; right: 0; top: 1470px; text-align: center; font-size: 30px; color: #8d877b; }
</style>
<script src="../scripts/v28_conseils.js"></script>
<script src="../shared/engine.js"></script>
<script>
// each row: tier, colour, which phrase fills it, emoji, name, reason, which word reveals the reason
const TIERS = [
  ['1', 'linear-gradient(135deg,#fff1c4,#d9b45a)', 'p7', '📸', '« Montre de fausses captures »', 'tu perds ta crédibilité pour toujours', 'p7.10'],
  ['2', 'linear-gradient(135deg,#f0d488,#b8913f)', 'p6', '💸', '« Mets tout ton argent dans la pub »', 'apprends avant de payer', 'p6.9'],
  ['3', 'linear-gradient(135deg,#d9b45a,#8a6a25)', 'p5', '🏃', '« Quitte ton job pour te lancer »', 'teste d\'abord à côté, sans tout risquer', 'p5.8'],
  ['4', 'linear-gradient(135deg,#a88746,#5e4a22)', 'p4', '📱', '« Poste 10 fois par jour »', 'la qualité compte plus que la quantité', 'p4.7'],
  ['5', 'linear-gradient(135deg,#7a6640,#3a3020)', 'p3', '😎', '« Fais comme moi, c\'est facile »', 'rien n\'est facile au début', 'p3.7'],
];
window.build = () => {
  const g = document.getElementById('grid');
  TIERS.forEach(([t, col, p, e, n, r, rc], i) => {
    const next = i === 0 ? 'p8' : TIERS[i - 1][2];
    g.insertAdjacentHTML('beforeend', `<div class="row" data-class="${p}|cur;${next}-0.05|was">
      <div class="lab${/[0-9]/.test(t) ? '' : ' medal'}" style="background:${col}">${t}</div>
      <div class="slot"><div class="q">?</div>
        <div class="item${i === 0 ? ' top' : ''}" data-cue="${p}.${i === 0 ? 5 : 0}" data-anim="${i === 0 ? 'slam' : 'right'}" ${i === 0 ? 'data-flash' : 'data-sfx="pop"'}>
          <span class="e">${e}</span><div><div class="n">${n}</div><div class="r" data-cue="${rc}" data-anim="up">${r}</div></div></div></div></div>`);
  });
};
window.onFrame = (t, { cue }) => {
  document.querySelectorAll('.row').forEach(r => { if (r.classList.contains('was')) r.classList.remove('cur'); });
};
</script>
</head>
<body>
<div id="stage"><div id="cam">
  <canvas id="silk" width="270" height="480"></canvas><canvas id="dust" width="1080" height="1920"></canvas><div class="vignette"></div>

  <!-- tier list (hook = empty list already on screen) -->
  <section class="scene" data-to="p8">
    <div class="title"><div class="k" data-cue="-0.5" data-anim="none">LES PIRES CONSEILS</div><div class="t" data-cue="-0.5" data-anim="none">business vus sur les réseaux</div></div>
    <div class="grid" id="grid"></div>
    <div class="opinion" data-cue="p1.0">Classement · mon avis</div>
    <div class="subov card" data-cue="p2.0" data-anim="pop" data-out="p3-0.1" data-sfx-at="p2.0+0.7|ding"><div style="font-size:54px;font-weight:800;margin-bottom:26px">Tu veux d'autres vidéos comme ça ?</div>
      <span class="subbtn" data-class="p2.0+0.7|done"><span class="a">＋ S'abonner</span><span class="b">Abonné ✓</span></span></div>
  </section>

  <!-- CTA -->
  <section class="scene" data-from="p8" data-glow>
    <div class="center" style="top:300px"><span class="kin light" data-cue="p8.0" style="font-size:80px">Tu veux te lancer proprement ?</span></div>
    <div class="center" style="top:520px"><span class="kin" data-cue="p8.6" style="font-size:110px">Écris-moi</span></div>
    <div class="center" style="top:640px"><span class="goldtxt" style="font-size:300px;line-height:1.05" data-cue="p8.8" data-anim="slam" data-flash>GO</span></div>
    <div class="center" style="top:980px"><span class="kin light" data-cue="p8.10" style="font-size:90px">en DM 📩</span></div>
    <div class="center" style="top:1140px"><span class="gold" data-cue="p8.13" style="font-size:96px">je te dis par où commencer.</span></div>
    <div class="center" style="top:1420px"><span class="tiny" data-cue="p8.0" style="font-size:28px">Contenu éducatif · aucun résultat garanti</span></div>
  </section>
</div><div id="flash"></div></div>
</body>
</html>
